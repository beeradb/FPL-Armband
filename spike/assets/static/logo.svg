<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260" role="img" aria-label="FPL Armband">
  <!-- band tails, behind the shield -->
  <rect x="6" y="112" width="208" height="46" rx="9" fill="#1C34A8"/>
  <!-- shield -->
  <path d="M110 16 L192 60 V148 c0 50-34 82-82 100 -48-18-82-50-82-100 V60 Z"
        fill="#131C26" stroke="#2C3B49" stroke-width="2"/>
  <!-- circuit traces -->
  <g stroke="#4C6072" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M110 40 V220"/>
    <path d="M110 62 H82 V96"/>
    <path d="M110 62 H138 V96"/>
    <path d="M110 198 H82 V166"/>
    <path d="M110 198 H138 V166"/>
  </g>
  <g fill="#4C6072">
    <circle cx="110" cy="38" r="6"/><circle cx="82" cy="100" r="6"/><circle cx="138" cy="100" r="6"/>
    <circle cx="110" cy="222" r="6"/><circle cx="82" cy="162" r="6"/><circle cx="138" cy="162" r="6"/>
  </g>
  <!-- the armband -->
  <path d="M28 112 H192 V158 H28 Z" fill="#2F53F0"/>
  <rect x="6" y="112" width="208" height="46" rx="9" fill="none"/>
  <!-- captain C -->
  <text x="110" y="149" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif"
        font-size="46" font-weight="800" fill="#FFFFFF">C</text>
</svg>
