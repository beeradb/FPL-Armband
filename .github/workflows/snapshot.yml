# Regenerate the accuracy snapshot and publish it, so nobody does it by hand.
#
# # Why this exists
#
# `TestSnapshotCoversTheCurrentCode` fails when watched code has moved since the
# newest snapshot. That guard is right and worth keeping — it is the only thing
# tying a figure in the record to the code that produced it. But its digest is
# over source blobs, so a COMMENT-ONLY edit trips it, and the cost lands on a
# person: run eight diagnostics, render, commit a directory.
#
# Measured on 2026-08-16, over four regenerations in one session, every one of
# them forced by a change with no behavioural content: the diagnostics take about
# 90 seconds and one of the four moved no figure at all except the commit stamp.
#
# So the fix is not to weaken the gate. It is to stop making a human pay it.
#
# ⚠️ Note what this does NOT save. Deciding whether a change was inert still
# requires computing the figures, so the 90 seconds is irreducible — it just
# moves off the developer's machine. An earlier design proposed comparing a
# figures digest to avoid banking a directory; that saves the directory and not
# the time, and externalising the series saves the directory anyway.
#
# # Why it is a separate workflow
#
# ⚠️ This needs `contents: write` to publish. `ci.yml` runs the pull request's own
# test files under `contents: read` and holds no secrets, and that combination is
# the only reason a fork PR is safe there. **These must never become one
# workflow.** A fork cannot trigger `push:` on the default branch, so nothing
# here runs on untrusted code.

name: Snapshot

on:
  push:
    branches: [main]
  # ⚠️ Added so the figures gate runs BEFORE a merge rather than after it. Until
  # this, `Refuse a silent change in the figures` fired on push to `main` — which
  # made it a detector, not a gate: by the time it spoke, the change it objected
  # to had already landed and the author had moved on. The whole argument for a
  # gate over a report is that it asks the author while they still know.
  #
  # No comparison logic changes. figures-moved-check.py already compares against
  # the newest published Release, and the newest Release IS what is on `main` — so
  # on a pull request that is exactly the head-versus-base comparison wanted, with
  # no second code path to keep in step with the first.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # Needed by "Tell open pull requests their accuracy baseline moved". Inert on a
  # pull_request run, where that step is skipped and GitHub downgrades the token
  # for forks regardless of what is declared here.
  pull-requests: write
  # Pages deployment needs both, and they are inert unless the dashboard steps
  # run — which they only do when PUBLISH_ACCURACY_PAGE is set on the repository.
  pages: write
  id-token: write

concurrency:
  # ⚠️ Keyed by ref, not the constant it used to be. With one fixed group a pull
  # request run and the `main` run would queue behind each other, and since
  # `cancel-in-progress` is false for `main` — a publish must never be killed
  # half-written — a busy branch could hold the publish queue indefinitely.
  group: snapshot-${{ github.ref }}
  # Superseding a pull request's own earlier run is fine and saves a runner; a
  # push to `main` publishes and must be left alone.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The key records a watched digest recomputed from the commit it names,
          # so the history has to be here. See ci.yml, which says this at length.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache the season archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fpl
          key: fpl-archive-${{ hashFiles('internal/backtest/season.go', 'internal/priors/priors.go') }}
          restore-keys: fpl-archive-

      # ⚠️ `-count=1` is load-bearing. Without it a second invocation on an
      # unchanged tree returns `ok (cached)`, runs no diagnostic, writes nothing
      # to FPL_MODEL_CSV — and exits 0. The renderer then banks a snapshot
      # carrying `model.present,false`: 555 figures silently absent from a
      # command that reported success. That has happened in this repository.
      - name: Run the accuracy diagnostics
        env:
          FPL_MODEL_CSV: ${{ runner.temp }}/model.csv
          DIAG: "1"
        run: |
          go test ./internal/backtest -count=1 -timeout 120m \
            -run 'TestDiagCalibrationDrift|TestDiagCleanSheetPoisson|TestDiagPredictionBenchmark|TestDiagNextFivePredictors|TestDiagSixty|TestDiagDefconBias|TestDiagTeamBlend|TestDiagTransferError'

      # ⚠️ A fresh file per run, and asserted to hold exactly one run before it is
      # used. The diagnostics APPEND, and the renderer takes newest-wins per
      # figure, so a reused path lets a stale run from another commit win a
      # figure. That is how a snapshot once shipped pre-fix figures under a commit
      # that had the fix. A runner's temp directory is fresh, and this checks
      # rather than assuming it.
      - name: Assert the model CSV holds exactly one run
        env:
          MODEL_CSV: ${{ runner.temp }}/model.csv
        run: |
          runs=$(awk -F, 'NR>1 {print $2}' "$MODEL_CSV" | sort -u | wc -l)
          echo "runs in the model CSV: $runs"
          if [ "$runs" -ne 1 ]; then
            echo "::error::expected exactly one run, found $runs — a stale run could win a figure"
            exit 1
          fi

      # ⚠️ The path this step writes is captured HERE, from the command's own stdout,
      # and carried to the publish step below rather than re-derived there. Do not
      # go back to deriving it from a directory listing — see the publish step's
      # own comment for the failure that produced this rule.
      - name: Render the snapshot
        env:
          MODEL_CSV: ${{ runner.temp }}/model.csv
        run: |
          out=$(go run ./cmd/armband snapshot -model "$MODEL_CSV")
          echo "$out"
          # cmd/armband/snapshot.go's own Printf: "wrote %s\n", <dir>/snapshot.md —
          # the ONE place this path is constructed, so parsing it here is reading
          # the writer's own answer rather than guessing at its naming convention.
          dir=$(printf '%s\n' "$out" | sed -nE 's#^wrote (stats/snapshots/[^/]+)/snapshot\.md$#\1#p')
          if [ -z "$dir" ]; then
            echo "::error::could not find the 'wrote <dir>/snapshot.md' line in the render output"
            exit 1
          fi
          echo "snapshot_dir=$dir" >> "$GITHUB_ENV"

      # Published as a release asset rather than committed. That is the whole
      # point: the series leaves the repository and its history, and this is where
      # it goes instead. The tag names the commit the snapshot describes, so it is
      # resolvable without reading the assets.
      #
      # ⚠️ The published series is NOT a citable record. Nothing in the repository
      # may point at it — see the retired-location guard, which forbids replacing
      # an in-repo path with a location outside the repository. It is here so a
      # figure can be checked, not so a comment can link to it.
      #
      # ⚠️ FIXED 2026-08-22. This used to pick the directory with
      # `ls -d stats/snapshots/*/ | sort | tail -1` — lexical order over EVERY
      # directory under the path, including every one already committed from
      # history. That is the exact mistake internal/snapshot.FindPrevious's own
      # doc comment names and refuses: "lexical order LOOKS chronological and is
      # wrong the moment two snapshots share a day." Verified against the 20 most
      # recent of this workflow's own published releases: 12 shipped a `key.csv`
      # naming a DIFFERENT commit than the release tag claimed, because a
      # committed directory from earlier the same day sorted after the one this
      # run had just written — the render step's real diagnostics, computed and
      # then silently discarded. `$snapshot_dir` from the render step is the one
      # directory this run actually produced; there is no derivation left to get
      # wrong.
      # ⚠️ **Runs BEFORE the publish**, so a silent move never becomes a release.
      # Ordering it after would let the series record a change the build already
      # declined to explain, which is the state this gate exists to end.
      #
      # For ten days nothing compared one snapshot to the next, and in that window
      # exactly two commits moved the figures. One traded early-season calibration
      # for late-season calibration roughly three to one and nobody knew for a day.
      # A report would not have caught it because nobody was reading; a gate stops
      # the build and asks the author while they still know.
      #
      # ⚠️ Movement is NOT failure. A scoring-constant change should move the
      # figures. What this refuses is movement nobody declared — the only kind that
      # cannot be reviewed.
      - name: Refuse a silent change in the figures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ env.snapshot_dir }}
        run: |
          python3 scripts/figures-moved-check.py \
            --current "$DIR/figures.csv" --tmp "${{ runner.temp }}"

      - name: Publish the snapshot
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          DIR: ${{ env.snapshot_dir }}
        run: |
          # ⚠️ `"$dir"/*`, not `"$dir"*` — FIXED 2026-08-23, in the FIRST live run of
          # the fix that introduced this bug. The old selection rule was
          # `ls -d stats/snapshots/*/ | sort | tail -1`, and `ls -d */` always
          # returns a trailing slash, so `"$dir"*` glob-expanded to the directory's
          # CONTENTS by accident. `$snapshot_dir` from the render step (this file's
          # own earlier fix) has no trailing slash, because that is not how
          # cmd/armband/snapshot.go prints the path it wrote -- so the same glob
          # matched the directory itself, `gh release create` tried to read it as a
          # file, and failed with "is a directory". Explicit `/*` does not depend on
          # whether $dir happens to end in a slash.
          dir="$DIR"
          short=$(git rev-parse --short "$SHA")
          tag="snapshot-$short"
          shopt -s nullglob
          assets=("$dir"/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no files matched $dir/* -- nothing to publish"
            exit 1
          fi
          echo "publishing $dir as $tag (${#assets[@]} files: ${assets[*]})"
          gh release create "$tag" "${assets[@]}" \
            --title "Accuracy snapshot at $short" \
            --notes "Generated by the Snapshot workflow. The model figures and the constants in force at \`$short\`." \
            || gh release upload "$tag" "${assets[@]}" --clobber

      # The series as a page, regenerated on every push so it cannot go stale the
      # way the record it replaces did. `accuracy-series.py` assembles the published
      # releases; `accuracy-dashboard.py` renders them.
      #
      # ⚠️ The page is a VIEW, not a citable record. This workflow's own rule stands:
      # the published series is here so a figure can be CHECKED, and nothing in the
      # repository may cite it as the source of a claim. The scripts are the citable
      # artefacts and they live in the tree.
      #
      # ⚠️ **TWO INDEPENDENT SWITCHES, AND THE ORDER MATTERS.** These steps are
      # gated on the `PUBLISH_ACCURACY_PAGE` repository VARIABLE — not on whether
      # Pages is enabled, which an earlier version of this comment wrongly said.
      #
      # So there are two settings, and setting them in the wrong order breaks the
      # build: with the variable set and Pages still disabled, `deploy-pages`
      # FAILS rather than skipping, because it has nowhere to deploy to.
      #
      #   1. Enable Pages on the repository, source "GitHub Actions".
      #   2. THEN set the variable `PUBLISH_ACCURACY_PAGE` to `true`.
      #
      # Unset, the steps skip and merging this file changes nothing — which is the
      # point: publishing a public site is a deliberate act, not a side effect of
      # a merge.
      #
      # ⚠️ The snapshot release is published by an EARLIER step, so a dashboard
      # failure never costs the series itself. It is left to fail loudly rather
      # than continue-on-error: a red main that nobody reads is how this
      # repository lost its staleness guard for four days.
      # ⚠️ TELLS OPEN PULL REQUESTS THEIR BASELINE MOVED.
      #
      # `pr-model-report.yml` posts "what moved" against the newest published
      # Release, and it triggers on `pull_request` ONLY — opened, synchronize,
      # reopened. It never re-runs when `main` moves. So the moment the step above
      # publishes a new snapshot, every open pull request carries a comment
      # computed against a Release that is no longer newest, still reporting on a
      # comparison that no longer exists.
      #
      # The baseline moved iff a new snapshot was published, which is exactly when
      # this step runs — so no figure comparison is needed to decide whether to
      # speak, and none is done.
      #
      # ⚠️ IT DOES NOT RECOMPUTE ANYTHING, and says so in the comment it posts.
      # Re-running the diagnostics for every open pull request on every merge would
      # be minutes of grid time to answer a question one push answers. This is a
      # STALENESS NOTICE. The distinction is stated in the body because a notice
      # that read like a recomputation would be trusted as one.
      #
      # ⚠️ ONE STICKY NOTICE PER PULL REQUEST, edited in place via the marker
      # comment. Appending a fresh notice per merge is how a channel earns being
      # muted, and a muted channel is worse than no channel.
      - name: Tell open pull requests their accuracy baseline moved
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="snapshot-$(echo "$SHA" | cut -c1-7)"
          prs="$(gh pr list --state open --json number -q '.[].number' || true)"
          if [ -z "$prs" ]; then echo "no open pull requests"; exit 0; fi
          body="$(printf '%s\n' \
            "<!-- accuracy-baseline-moved -->" \
            "⚠️ **Your accuracy baseline moved.** \`main\` has published a new snapshot, \`$tag\`." \
            "" \
            "The **Model accuracy** comment on this pull request was computed against the" \
            "*previous* newest Release, so its \"What moved\" section answers a question about" \
            "a baseline that is no longer current." \
            "" \
            "**Push any commit to refresh it.** \`pr-model-report.yml\` triggers on" \
            "\`pull_request\`, so it re-runs on the next push and recomputes against \`$tag\`." \
            "" \
            "⚠️ This notice is not a recomputation. It does not claim your figures moved — only" \
            "that the thing they were compared against did.")"
          for n in $prs; do
            id="$(gh api "repos/$REPO/issues/$n/comments" --paginate \
                  -q '.[] | select(.body | contains("<!-- accuracy-baseline-moved -->")) | .id' \
                  | head -1 || true)"
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null \
                && echo "refreshed notice on #$n" || echo "could not edit notice on #$n"
            else
              gh pr comment "$n" --body "$body" >/dev/null \
                && echo "posted notice on #$n" || echo "could not comment on #$n"
            fi
          done

      - name: Build the accuracy dashboard
        if: github.event_name != 'pull_request' && vars.PUBLISH_ACCURACY_PAGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/accuracy-series.py --out site
          python3 scripts/accuracy-dashboard.py --in site --out site/index.html
          rm -rf site/rel site/series.json

      - name: Upload the dashboard
        if: github.event_name != 'pull_request' && vars.PUBLISH_ACCURACY_PAGE == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to Pages
        if: github.event_name != 'pull_request' && vars.PUBLISH_ACCURACY_PAGE == 'true'
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
