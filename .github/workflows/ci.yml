# The gates, run by a machine instead of by hand.
#
# Until this file existed, every check in this repository was run by a human
# following a checklist. That is not a criticism of the checklist — it is that a
# checklist cannot fail a merge, so "the gates passed" and "someone said the
# gates passed" were the same claim, and only one of them is checkable.
#
# `go test ./...` is the whole suite and takes about four minutes wall-clock;
# there is no value in splitting it into faster jobs that each report a partial
# answer. `internal/backtest`, `cmd/armband` and `internal/analysis` are ~90% of
# that time and they are the packages whose failure matters most.
#
# ⚠️ This job is the ONLY place the whole suite runs on a machine that is not the
# author's, and that is the point of it rather than a detail: a local run is
# uncheckable after the fact, and merge-gate condition 1 now cites this run by id
# as the witness a reader who was not present can pull. A partial job here would
# not be a smaller version of that check — it would leave a hole with nothing
# behind it.
#
# ⚠️ Expect `TestSnapshotCoversTheCurrentCode` to fail on any pull request that
# touches internal/analysis, internal/backtest, internal/config or config.json —
# INCLUDING a comment-only change, which moves the watched digest without
# changing behaviour. That is the gate working exactly as designed and it is
# also the known churn problem; it is not a reason to weaken this workflow. The
# fix belongs in the gate, not here.
#
# ⚠️ The triggers are `push` and `pull_request`, deliberately NOT
# `pull_request_target`. This job compiles and runs the pull request's own test
# files, so a fork PR already executes attacker-authored code. That is safe for
# two reasons and it takes both: the token is read-only, AND a fork's
# `pull_request` run receives no secrets.
#
# The second half used to be written here as "this workflow holds no secrets",
# which was already false when written — the leak scan below names
# `secrets.LEAKSCAN_PATTERN`. The reference is safe because a fork cannot read
# it and the scan skips-and-says-so; it is NOT made safe by the `pull_request`
# trigger, since a same-repo pull request reads secrets exactly as a push does.
# Correcting it matters because a safety argument that contradicts its own file
# is the one that gets waved through next time.
#
# So: `pull_request_target` breaks the first half. A secret a FORK could read
# breaks the second. Either change needs a security review, not a rubber stamp.

name: CI

on:
  push:
    # Every branch, not just main, mirroring image.yml. Until this changed, CI ran
    # only AFTER a merge had landed on `main` — a detector, not a gate, and one
    # nobody was reading: `main` merged four times over a red CI on 2026-08-19.
    # A run keyed to a pushed commit is something merge-gate condition 1 can cite
    # by id and a reader who was not there can pull. Branches are pushed before
    # merging anyway (condition 8), so this costs a trigger, not a habit.
    #
    # A same-repo branch with an open pull request therefore builds twice, once
    # per event. That is accepted rather than deduplicated. Folding both into one
    # concurrency group is the WRONG way to dedup — it would let a push cancel the
    # very run condition 1 is quoting. The right way is a job-level
    # `if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name
    # != github.repository`, which skips only the redundant pull_request run. It is
    # not worth the conditional today because no pull request has ever been opened
    # here, but dedup is available and safe — do not read this block as saying
    # otherwise.
    branches: ["**"]
  pull_request:

# A superseded run tells you about code nobody is going to merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs, not to mutable major tags. Nothing
      # here holds a secret, so a hijacked tag could not steal anything — but it
      # could tamper with the tree between checkout and `go test`, which makes
      # this job's verdict untrustworthy, and that verdict is the entire point.
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # ⚠️ LOAD-BEARING — do not "optimise" this to a shallow clone.
          # `TestAKeyDescribesTheCommitItNames` recomputes each snapshot key's
          # watched digest from the commit that key names, and it SKIPS commits
          # it cannot reach. Measured both ways: with a full clone it reports
          # "63 keys verified against their own commit, 0 unreachable"; with
          # --depth 1 it reports "no key names a commit reachable from this
          # checkout", SKIPs, and the package still says ok. A check that
          # degrades to a vacuous pass is worse than one that is absent, because
          # the absent one does not tell you it succeeded.
          fetch-depth: 0

      # The comment above is documentation; this step is enforcement. Without
      # it, one careless edit turns 63 verified keys into 0 and CI stays green
      # without saying a word.
      - name: Refuse a shallow checkout
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Shallow checkout. TestAKeyDescribesTheCommitItNames" \
                 "silently verifies nothing when the commits its keys name are" \
                 "unreachable. Restore fetch-depth: 0."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read from go.mod so the toolchain cannot drift from the module's
          # own declaration — one quantity, one implementation.
          go-version-file: go.mod
          cache: true

      # The suite downloads ~38 MB of archive data on a cold run, from the
      # `master`/`main` branches of two third-party repositories (see
      # internal/backtest/season.go and internal/priors/priors.go). Without this
      # cache every run re-fetches it, and every run's verdict depends on what
      # those branches happen to contain that minute. The cache does not make
      # the dependency go away — pinning those URLs to upstream commit SHAs is
      # the real fix and is not done here — but it means a green result stays
      # reproducible instead of being re-rolled on each run.
      - name: Cache the season archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/fpl
          # ⚠️ `.cache/fpl` is also `config.CacheDir` (internal/config/config.go),
          # so this uploads whatever the suite wrote through internal/fpl, not
          # only the season archive. This repository is public and a
          # default-branch-scoped cache is restorable by any fork's pull request
          # — treat this path as PUBLISHED. It is safe because `internal/fpl` has
          # no authenticated surface at all: no session cookie, no `my-team`, no
          # POST, pinned by `TestTheClientHasNoAuthenticatedSurface`. There is no
          # credential for this cache to capture. Reviving one re-opens this.
          # (An earlier version of this comment credited "the client refuses to
          # cache `my-team`" — a guard that no longer exists, which sent a reader
          # looking for the wrong thing and left the real one unnamed.)
          # ⚠️ The key is DERIVED, and a static one is a silent trap. `Load`
          # revalidates a cached season against the parse version, team
          # strength, availability, starts, restart gameweeks and rowGuardCount
          # — all defined in season.go — and refetches when any of them fails.
          # `actions/cache` does NOT save when the primary key hit exactly. So
          # under a static key, the first change that invalidates the cached
          # shape makes every run refetch 38 MB forever, while the cache still
          # reports a hit. It would look cached and buy nothing.
          #
          # Hashing the two files that DEFINE validity means the key moves
          # exactly when the cached bytes stop being acceptable, and the job
          # saves again because the primary key missed. It over-invalidates —
          # a comment-only edit to season.go moves the hash too — and that is
          # the right direction to be wrong in: `restore-keys` still restores
          # the previous archive, `Load` finds it valid and does not refetch,
          # and the run costs a re-save rather than a re-download. Loud and
          # self-correcting beats silent and permanent.
          key: fpl-archive-${{ hashFiles('internal/backtest/season.go', 'internal/priors/priors.go') }}
          restore-keys: fpl-archive-

      # ⚠️ This comment used to say "the private bare repository has a fail-closed
      # `pre-receive` hook doing this", and that there is no such hook on a hosted
      # remote so this step restores the guard "and a pull request is exactly when
      # it matters". Both halves were false. There is ONE remote, it is the public
      # GitHub repository, and no `pre-receive` hook runs anywhere on the push path
      # — so this step is not a restoration of a guard that exists elsewhere, it is
      # the ONLY automated guard on this channel. And a pull request is not when it
      # matters: every merge in this repository's history is a local merge commit
      # pushed straight to a branch, which is why this step is no longer gated on
      # the event.
      #
      # ⚠️ The pattern lives in a repository secret, NOT in the tracked script. A
      # published file containing the strings it searches for would be the
      # disclosure it exists to prevent. Unset means skip-and-say-so, because a
      # fork's pull request cannot read secrets and must not be failed for it.
      #
      # SHAs are passed through `env:` rather than interpolated into `run:`. They
      # are hex and safe, but the rule is worth keeping absolute: nothing
      # attacker-controlled has a path into a shell here.
      #
      # ⚠️ It runs on BOTH events, and it was `pull_request`-only until
      # 2026-08-19. In that state it had NEVER EXECUTED ONCE: this repository has
      # no pull request in its history — `git log --grep='Merge pull request'`
      # is empty and every merge is a local merge commit pushed straight to
      # `main` — so the condition was never true. The fallback the comment above
      # names is not on the path either: there is one remote, it is the public
      # GitHub repository, and no hosted remote runs a `pre-receive` hook. The
      # only automated guard on this channel was therefore a step that could not
      # fire, sitting under a green check.
      #
      # A fork's pull request still reads no secret and still skips, loudly, and
      # nothing new becomes reachable: a fork cannot trigger `push` here.
      - name: Scan the diff for disclosures
        env:
          LEAKSCAN_PATTERN: ${{ secrets.LEAKSCAN_PATTERN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # `github.event.before` is the ref's previous value, so it is the exact
          # pushed range. It is all-zeros on a branch's first push and unreachable
          # after a force-push, which is what the reachability test below is for;
          # both fall back to the whole branch against the default branch, which
          # over-scans rather than under-scans.
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          else
            range="origin/$DEFAULT_BRANCH..$GITHUB_SHA"
          fi
          echo "leakscan range: $range"
          ./scripts/leakscan "$range"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
