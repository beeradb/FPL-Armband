<!-- ===================== TOP BAR ===================== -->
<div class="topbar">
  <div class="row">
    <a class="logo" href="/">
      <svg width="37.5" height="20" viewBox="0 0 120 64" aria-hidden="true">
        <path d="M5 14 Q60 6 115 14 L115 50 Q60 58 5 50 Z" fill="#2F53F0"/>
        <rect x="38" y="5.5" width="44" height="53" rx="3.5" fill="#1B2F9E"/>

  </div>

<div class="wrap chipwrap" id="chipteam">

  <!-- Same register as /armband-team's intro, but every sentence is conditional -- this
       is a hypothetical about a chip we have not played, never a plan we will. -->
  <div class="chipintro">
    <span class="t-label">A hypothetical</span>
    <h1 class="t-sec">If we chipped.</h1>
    <p class="t-body" id="chipsub">This is the fifteen the model would buy with our money, this week.</p>
  </div>

  <div class="chipstrip">
    <div class="chiptabs">
      <button type="button" class="btn sm on" id="tab-wildcard">Wildcard</button>
      <button type="button" class="btn sm" id="tab-freehit">Free hit</button>
    </div>
    <div id="chipheader"></div>
  </div>

  <!-- The objective-mismatch clause: the two tabs' expected-points figures are
       comparable numbers built to different objectives, and that difference is
       the one thing this page must never let a bare number imply away. See the
       design note's own warning against an unlabelled shared column. -->
  <p class="t-body" id="chipclause"></p>

  <div id="chipbody"></div>

  <div id="chipout"></div>

</div>
